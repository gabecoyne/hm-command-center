# Cloudflare Pages + Functions + D1 config for the Host Modern Command Center.
# The static app (index.html, src/, vendor/, css/) is served by Pages from the repo root.
# The /functions directory implements the SAME API server.py exposes, backed by D1,
# so the existing frontend runs unchanged (same-origin /api/... calls).
name = "hm-command-center"
pages_build_output_dir = "."
compatibility_date = "2024-11-06"

# One database, the single source of truth both dashboards read. Create it once with:
#   npx wrangler d1 create hm-command-center
# then paste the returned database_id below (and into the Pages project bindings).
[[d1_databases]]
binding = "DB"
database_name = "hm-command-center"
database_id = "REPLACE_AFTER_d1_create"
